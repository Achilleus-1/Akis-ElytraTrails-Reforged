version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      maintenance:
        patterns: ['*']
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      maintenance:
        patterns: ['*']
    ignore:
      - dependency-name: gradle-wrapper
        update-types: ['version-update:semver-major']
