version: 2
registries:
  cloth-config:
    type: maven-repository
    url: https://maven.shedaniel.me
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      maintenance:
        patterns: ['*']
  - package-ecosystem: gradle
    registries: [cloth-config]
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      maintenance:
        patterns: ['*']
    ignore:
      - dependency-name: gradle-wrapper
        update-types: ['version-update:semver-major']
      # Cloth Config 15 is the Minecraft 1.21/1.21.1 release family.
      - dependency-name: 'me.shedaniel.cloth:cloth-config-neoforge'
        update-types: ['version-update:semver-major']
